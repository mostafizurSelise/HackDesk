server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain application/x-javascript text/xml text/css application/xml text/javascript application/javascript application/json application/font-woff application/font-woff2 application/vnd.ms-fontobject application/x-font-ttf font/opentype;

  # Hashed build assets never change content — cache them immutably.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The env snapshot changes with every deploy — never cache it.
  location ~ ^/env\.[A-Za-z0-9]+$ {
    add_header Cache-Control "no-store";
  }

  # index.html references the current hashed bundle — always revalidate.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
